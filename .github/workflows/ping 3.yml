name: RSS Ping - Group 3

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ping Group 3 (Link 9-12)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URLS: ${{ secrets.WORKER_URLS }}
        run: |
          IFS=$'\n' read -r -d '' -a ALL_URLS <<< "$WORKER_URLS" || true
          
          # Ambil 4 link terakhir (index 8 sampai 11)
          TARGET_URLS=("${ALL_URLS[@]:8:4}")
          
          for url in "${TARGET_URLS[@]}"; do
            [ -z "$url" ] && continue
            echo "Pinging: $url"
            
            status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")
            echo "Status: $status_code"
            
            if [ "$status_code" -ne 200 ]; then
              MESSAGE="⚠️ <b>[Group 3] Worker Trigger Failed!</b>%0A%0A<b>URL:</b> $url%0A<b>Status:</b> $status_code"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=${MESSAGE}" \
                -d "parse_mode=HTML"
            fi
            sleep 10
          done

      - name: Update README.md Timestamp
        run: |
          LAST_RUN=$(TZ="Asia/Jakarta" date +"%Y-%m-%d %H:%M:%S WIB")
          
          cat << EOF > README.md
          # RSS Bot Trigger Monitor

          Automated backup trigger for Cloudflare Workers RSS Bot.

          - **Status:** Active
          - **Last Cron Run:** \`$LAST_RUN\`
          EOF

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add README.md
          
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada README.md"
          else
            git commit -m "chore: update last run timestamp [skip ci]"
            git push
          fi
