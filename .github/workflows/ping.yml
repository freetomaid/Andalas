name: RSS Workers Manual Trigger Ping

on:
  schedule:
    # Berjalan otomatis setiap 5 menit sekali
    - cron: '*/5 * * * *'
  # Memungkinkan trigger manual dari tab Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ping Workers Endpoints
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URLS: ${{ secrets.WORKER_URLS }}
        run: |
          echo "=== Memulai Ping Endpoints ==="
          
          # Mengatur Internal Field Separator (IFS) ke karakter newline
          IFS=$'\n' read -r -d '' -a URLS <<< "$WORKER_URLS" || true
          
          for url in "${URLS[@]}"; do
            # Abaikan jika ada baris kosong
            [ -z "$url" ] && continue
            
            echo "Pinging: $url"
            
            # Request HTTP GET dengan timeout 10 detik
            status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
            echo "Status: $status_code"
            
            # Jika status code BUKAN 200, kirim notifikasi ke Telegram
            if [ "$status_code" -ne 200 ]; then
              MESSAGE="⚠️ <b>Worker Trigger Failed!</b>%0A%0A<b>URL:</b> $url%0A<b>Status Code:</b> $status_code"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=${MESSAGE}" \
                -d "parse_mode=HTML"
            fi
            
            # Jeda 10 detik antar link
            sleep 10
          done
          
          echo "=== Selesai Ping Semua Endpoint ==="

      - name: Update README.md Timestamp
        run: |
          LAST_RUN=$(TZ="Asia/Jakarta" date +"%Y-%m-%d %H:%M:%S WIB")
          
          cat << EOF > README.md
          # RSS Bot Trigger Monitor

          Automated backup trigger for Cloudflare Workers RSS Bot.

          - **Status:** Active
          - **Last Cron Run:** \`$LAST_RUN\`
          EOF

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add README.md
          
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada README.md"
          else
            git commit -m "chore: update last run timestamp [skip ci]"
            git push
          fi
