name: RSS Ping - Group 1

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Group 1 (Link 1-4)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URLS: ${{ secrets.WORKER_URLS }}
        run: |
          IFS=$'\n' read -r -d '' -a ALL_URLS <<< "$WORKER_URLS" || true
          
          # Ambil 4 link pertama (index 0 sampai 3)
          TARGET_URLS=("${ALL_URLS[@]:0:4}")
          
          for url in "${TARGET_URLS[@]}"; do
            [ -z "$url" ] && continue
            echo "Pinging: $url"
            
            status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")
            echo "Status: $status_code"
            
            if [ "$status_code" -ne 200 ]; then
              MESSAGE="⚠️ <b>[Group 1] Worker Trigger Failed!</b>%0A%0A<b>URL:</b> $url%0A<b>Status:</b> $status_code"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=${MESSAGE}" \
                -d "parse_mode=HTML"
            fi
            sleep 10
          done
